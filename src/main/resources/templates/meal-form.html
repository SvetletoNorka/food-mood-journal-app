<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/nav-side-bar.css">
  <link rel="stylesheet" href="/css/home-common.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/food-form.css">
  <link rel="stylesheet" href="/css/meals.css">
  <title>Log Meal</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <div class="nav-bar">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
  </div>
  <div class="home-section">
    <div class="journal-form-panel" style="max-width:560px">
      <a href="/meals" class="back-link">← Back to meals</a>
      <h2>Log a meal</h2>

      <div th:if="${#lists.isEmpty(foods)}" class="alert-warning" style="margin-bottom:16px">
        <a href="/foods/new" style="color:inherit">Add foods</a> before logging a meal.
      </div>

      <form th:action="@{/meals}" th:object="${createMealRequest}" method="post" id="meal-form">
        <label for="mealType">Meal type</label>
        <select id="mealType" th:field="*{mealType}">
          <option th:each="type : ${T(app.model.entity.meal.MealType).values()}"
                  th:value="${type}" th:text="${type}"></option>
        </select>
        <p class="alert-warning" th:if="${#fields.hasErrors('mealType')}" th:errors="*{mealType}"></p>

        <label for="eatenAt">Eaten at</label>
        <input type="datetime-local" id="eatenAt" th:field="*{eatenAt}">
        <p class="alert-warning" th:if="${#fields.hasErrors('eatenAt')}" th:errors="*{eatenAt}"></p>

        <h3 style="margin-top:20px">Foods in this meal</h3>
        <div id="entries-container">
          <div class="meal-entry-row" th:each="entry, stat : *{entries}">
            <select th:field="*{entries[__${stat.index}__].foodId}">
              <option value="">— Select food —</option>
              <option th:each="food : ${foods}" th:value="${food.id}" th:text="${food.name}"></option>
            </select>
            <input type="number" min="1" placeholder="Grams" th:field="*{entries[__${stat.index}__].quantityInGrams}">
            <button type="button" class="btn-delete remove-entry" th:if="${stat.index > 0}">×</button>
          </div>
        </div>
        <p class="alert-warning" th:if="${#fields.hasErrors('entries')}" th:errors="*{entries}"></p>

        <button type="button" class="btn-add-entry" id="add-entry">+ Add another food</button>
        <button type="submit" th:disabled="${#lists.isEmpty(foods)}">Save meal</button>
      </form>
    </div>
  </div>
</main>
<script th:inline="javascript">
  let entryIndex = /*[[${createMealRequest.entries.size()}]]*/ 1;

  function reindexEntries() {
    document.querySelectorAll('#entries-container .meal-entry-row').forEach((row, i) => {
      row.querySelectorAll('[name]').forEach(el => {
        el.name = el.name.replace(/entries\[\d+]/, 'entries[' + i + ']');
      });
    });
    entryIndex = document.querySelectorAll('#entries-container .meal-entry-row').length;
  }

  document.getElementById('add-entry')?.addEventListener('click', () => {
    const container = document.getElementById('entries-container');
    const clone = container.querySelector('.meal-entry-row').cloneNode(true);
    clone.querySelector('select').selectedIndex = 0;
    clone.querySelector('input[type=number]').value = '100';
    if (!clone.querySelector('.remove-entry')) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-delete remove-entry';
      btn.textContent = '×';
      clone.appendChild(btn);
    }
    container.appendChild(clone);
    reindexEntries();
    bindRemoveButtons();
  });

  function bindRemoveButtons() {
    document.querySelectorAll('.remove-entry').forEach(btn => {
      btn.onclick = () => {
        if (document.querySelectorAll('.meal-entry-row').length > 1) {
          btn.closest('.meal-entry-row').remove();
          reindexEntries();
        }
      };
    });
  }
  bindRemoveButtons();
</script>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
