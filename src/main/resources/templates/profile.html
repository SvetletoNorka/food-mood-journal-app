<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/nav-side-bar.css">
  <link rel="stylesheet" href="/css/home-common.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/journal-visuals.css">
  <title>Profile</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <div class="nav-bar">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
  </div>

  <div class="home-section">
    <div class="insights-flash" th:if="${successMessage}" th:text="${successMessage}"
         style="background:linear-gradient(145deg,#ecfdf5,#d1fae5);border:1px solid #6ee7b7;color:#065f46;padding:12px 16px;border-radius:10px;margin-bottom:16px"></div>

    <div class="single-section-box home-profile-information">
      <div class="profile-header">
        <h2 class="profile-name" th:text="${user.username}">User</h2>
        <div class="profile-status-role-container">
          <p class="active-profile" th:text="${user.role}">USER</p>
        </div>
      </div>
      <div class="profile-info">
        <div class="details-section-container">
          <strong>Username: </strong>
          <p th:text="${user.username}"></p>
        </div>
        <div class="details-section-container">
          <strong>Email: </strong>
          <p th:text="${user.email}"></p>
        </div>
        <div class="details-section-container">
          <strong>Status: </strong>
          <p th:text="${user.isActive} ? 'Active' : 'Inactive'"></p>
        </div>
        <div class="details-section-container">
          <strong>Joined: </strong>
          <p th:text="${user.createdOn}"></p>
        </div>
      </div>
      <div class="profile-actions" style="margin-top:16px">
        <a href="/profile/edit" class="link-accent-lilac">Edit profile →</a>
      </div>
    </div>
  </div>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
