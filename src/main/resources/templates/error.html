<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/journal-brand.css">
  <title>Error</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <section class="error-section">
    <a href="/" class="brand-link">
      <img src="/images/journal-logo.svg" alt="Food Mood Journal" width="220">
    </a>
    <div class="error-card">
      <h1>Something went wrong</h1>
      <p class="alert-warning" th:text="${errorMessage}">An unexpected error occurred.</p>
      <p><a href="/home">Go to dashboard</a> · <a href="/">Back to home</a></p>
    </div>
  </section>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
<style>
  .error-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
  }
  .error-card {
    max-width: 480px;
    width: 100%;
    padding: 28px 32px;
    text-align: center;
    background: rgba(255, 255, 255, 0.88);
    border: 2px solid rgba(196, 181, 253, 0.45);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(167, 139, 250, 0.2);
  }
  .error-card h1 {
    margin: 0 0 16px;
    font-size: 1.5rem;
    color: var(--journal-lilac-dark, #6d5aaa);
  }
  .error-card a {
    color: var(--journal-lilac-deep, #8b6fd4);
  }
</style>
</body>
</html>
