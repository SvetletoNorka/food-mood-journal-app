<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/journal-brand.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/journal-visuals.css">
  <title>Register</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <section class="section full-height">
    <div class="container">
      <a href="/" class="brand-link">
        <img src="/images/journal-logo.svg" alt="Food Mood Journal" width="280">
      </a>
    </div>

    <form class="form" th:action="@{/register}" th:object="${userRegisterRequest}" method="post">
      <h3>Register Here</h3>

      <p class="alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></p>

      <label for="username">Username</label>
      <input type="text" placeholder="Username" id="username" th:field="*{username}">
      <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

      <label for="email">Email</label>
      <input type="email" placeholder="Email" id="email" th:field="*{email}">
      <p class="alert-warning" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

      <label for="password">Password</label>
      <input type="password" placeholder="Password" id="password" th:field="*{password}">
      <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

      <button type="submit">Register</button>
      <p class="form-already">Already have an account? <a href="/login">Login</a>!</p>
    </form>
  </section>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
