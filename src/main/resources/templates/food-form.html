<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/nav-side-bar.css">
  <link rel="stylesheet" href="/css/home-common.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/food-form.css">
  <title th:text="${isEdit} ? 'Edit Food' : 'Add Food'">Food Form</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <div class="nav-bar">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
  </div>
  <div class="home-section">
    <div class="journal-form-panel">
      <a href="/foods" class="back-link">← Back to foods</a>
      <h2 th:text="${isEdit} ? 'Edit food' : 'Add new food'">Add food</h2>

      <form th:if="${!isEdit}" th:action="@{/foods}" th:object="${createFoodRequest}" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}">
        <p class="alert-warning" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label for="calories">Calories per 100g</label>
        <input type="number" step="0.1" id="calories" th:field="*{caloriesPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('caloriesPer100g')}" th:errors="*{caloriesPer100g}"></p>

        <label for="protein">Protein per 100g (g)</label>
        <input type="number" step="0.1" id="protein" th:field="*{proteinPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('proteinPer100g')}" th:errors="*{proteinPer100g}"></p>

        <label for="fat">Fat per 100g (g)</label>
        <input type="number" step="0.1" id="fat" th:field="*{fatPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('fatPer100g')}" th:errors="*{fatPer100g}"></p>

        <label for="carbs">Carbs per 100g (g)</label>
        <input type="number" step="0.1" id="carbs" th:field="*{carbsPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('carbsPer100g')}" th:errors="*{carbsPer100g}"></p>

        <button type="submit">Save food</button>
      </form>

      <form th:if="${isEdit}" th:action="@{/foods/{id}(id=${foodId})}" th:object="${editFoodRequest}" method="post">
        <label for="edit-name">Name</label>
        <input type="text" id="edit-name" th:field="*{name}">
        <p class="alert-warning" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label for="edit-calories">Calories per 100g</label>
        <input type="number" step="0.1" id="edit-calories" th:field="*{caloriesPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('caloriesPer100g')}" th:errors="*{caloriesPer100g}"></p>

        <label for="edit-protein">Protein per 100g (g)</label>
        <input type="number" step="0.1" id="edit-protein" th:field="*{proteinPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('proteinPer100g')}" th:errors="*{proteinPer100g}"></p>

        <label for="edit-fat">Fat per 100g (g)</label>
        <input type="number" step="0.1" id="edit-fat" th:field="*{fatPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('fatPer100g')}" th:errors="*{fatPer100g}"></p>

        <label for="edit-carbs">Carbs per 100g (g)</label>
        <input type="number" step="0.1" id="edit-carbs" th:field="*{carbsPer100g}">
        <p class="alert-warning" th:if="${#fields.hasErrors('carbsPer100g')}" th:errors="*{carbsPer100g}"></p>

        <button type="submit">Update food</button>
      </form>
    </div>
  </div>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
