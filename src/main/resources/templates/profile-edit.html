<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/nav-side-bar.css">
  <link rel="stylesheet" href="/css/home-common.css">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/food-form.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/journal-visuals.css">
  <title>Edit Profile</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <div class="nav-bar">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
  </div>

  <div class="home-section">
    <div class="food-form-card">
      <h2>Edit profile</h2>
      <p th:text="'Username: ' + ${user.username}" style="color:#666;margin-bottom:12px"></p>
      <p class="alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></p>

      <form th:action="@{/profile}" th:object="${editProfileRequest}" method="post">
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" required>
        <p class="alert-warning" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="newPassword">New password (optional)</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="Leave blank to keep current">
        <p class="alert-warning" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Confirm if changing password">

        <div style="display:flex;gap:12px;margin-top:16px">
          <button type="submit">Save changes</button>
          <a href="/profile" class="link-accent-lilac" style="align-self:center">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
