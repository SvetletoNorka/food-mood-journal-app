<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/nav-side-bar.css">
  <link rel="stylesheet" href="/css/home-common.css">
  <link rel="stylesheet" href="/css/journal-theme.css">
  <link rel="stylesheet" href="/css/journal-visuals.css">
  <link rel="stylesheet" href="/css/meals.css">
  <title>Meals</title>
</head>
<body class="journal-app-bg">
<div th:replace="~{fragments/background-decor :: backgroundDecor}"></div>
<main>
  <div class="nav-bar">
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
  </div>
  <div class="home-section">
    <div class="new-meal-banner">
      <a href="/meals/new">+ Log new meal</a>
    </div>
    <div class="meals-list">
      <div class="empty-state" th:if="${#lists.isEmpty(meals)}">
        <img src="/images/mood/unknown.svg" class="mood-emoji-lg" alt="">
        <h2>No meals logged yet</h2>
        <p>Log your first meal and pick a mood face afterwards.</p>
      </div>
      <div class="meal-card-block meal-card-mood" th:each="meal : ${meals}">
        <div th:replace="~{fragments/mood-icon :: moodIcon(${meal.moodScore})}"></div>
        <div class="meal-card-content">
          <h3 th:text="${meal.mealType} + ' — ' + ${#temporals.format(meal.eatenAt, 'dd MMM yyyy HH:mm')}">Meal</h3>
          <div class="meal-card-totals">
            <span th:text="'Cal: ' + ${meal.totalCalories}"></span>
            <span th:text="'P: ' + ${meal.totalProtein} + 'g'"></span>
            <span th:text="'F: ' + ${meal.totalFat} + 'g'"></span>
            <span th:text="'C: ' + ${meal.totalCarbs} + 'g'"></span>
          </div>
          <div th:if="${meal.moodScore != null}" class="wellness-pill" style="margin-top:8px">
            <span th:text="'Mood ' + ${meal.moodScore} + '/10'"></span>
            <span th:text="' · Energy ' + ${meal.energyScore} + '/10'"></span>
          </div>
          <p th:if="${meal.moodScore == null}" class="meal-card-meta">Wellness not logged — add your mood face</p>
        </div>
        <div class="meal-card-actions">
          <a th:href="@{/meals/{id}(id=${meal.id})}">View details</a>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="footer"><p>© 2026 Food Mood Journal. All rights reserved.</p></div>
</body>
</html>
